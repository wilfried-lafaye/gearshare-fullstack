services:
  api:
    # On adapate les chemins par rapport à notre arborescence 
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
      - ./tests:/code/tests
      - ./backend/pytest.ini:/code/pytest.ini
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
